[project]
name = "planilha-pdf"
version = "0.1.0"
description = "Converte planilhas de cobrança (.xlsx/.csv) em relatórios PDF"
readme = "README.md"
authors = [
    { name = "Decode Dev", email = "dev@decodedata.com.br" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
planilha-pdf = "planilha_pdf:main"
planilha-pdf-tela = "planilha_pdf.web:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "pytest-bdd>=8.1.0",
]
